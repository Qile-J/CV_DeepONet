<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowFaint" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="590" fill="#f8fafc"/>

  <!-- INPUT -->
  <rect x="260" y="24" width="720" height="48" rx="24" fill="#e2e8f0" stroke="#cbd5e1"/>
  <text x="620" y="53" text-anchor="middle" font-size="14.5" fill="#1e293b">
    <tspan font-weight="700">Any scattering target</tspan> — mesh geometry + incident &amp; total fields across many frequencies
  </text>
  <line x1="620" y1="72" x2="620" y2="102" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- CONDUCTOR -->
  <rect x="40" y="104" width="1159" height="50" rx="12" fill="#0f172a" filter="url(#shadow)"/>
  <text x="620" y="127" text-anchor="middle" font-size="14.5" font-weight="700" fill="#ffffff">orchestrate.py — the conductor</text>
  <text x="620" y="145" text-anchor="middle" font-size="12.5" fill="#cbd5e1">launches each role as an autonomous Codex CLI agent · full autonomy, no sandbox · data-only workspace (the published solution is hidden)</text>

  <!-- conductor -> cards (dashed launch lines) -->
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 4">
    <line x1="165"  y1="154" x2="165"  y2="208" marker-end="url(#arrowFaint)"/>
    <line x1="468"  y1="154" x2="468"  y2="208" marker-end="url(#arrowFaint)"/>
    <line x1="771"  y1="154" x2="771"  y2="208" marker-end="url(#arrowFaint)"/>
    <line x1="1074" y1="154" x2="1074" y2="208" marker-end="url(#arrowFaint)"/>
  </g>

  <!-- CARD 1 — ANALYST -->
  <g>
    <rect x="40" y="210" width="250" height="212" rx="14" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
    <rect x="58" y="228" width="168" height="26" rx="13" fill="#0d9488"/>
    <text x="142" y="246" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">1 · ANALYST</text>
    <text x="58" y="288" font-size="19" font-weight="700" fill="#0f172a">Understand</text>
    <text x="58" y="314" font-size="12.5" fill="#475569"><tspan x="58" dy="0">Loads the data and measures the</tspan><tspan x="58" dy="18">mesh; finds sharp regions and</tspan><tspan x="58" dy="18">field hotspots; plots everything.</tspan></text>
    <rect x="58" y="372" width="214" height="30" rx="8" fill="#ccfbf1"/>
    <text x="165" y="391" text-anchor="middle" font-size="12.5" font-weight="600" fill="#0f766e">→ ledger.json + figures</text>
  </g>

  <!-- CARD 2 — ARCHITECT -->
  <g>
    <rect x="343" y="210" width="250" height="212" rx="14" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
    <rect x="361" y="228" width="178" height="26" rx="13" fill="#4f46e5"/>
    <text x="450" y="246" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">2 · ARCHITECT</text>
    <text x="361" y="288" font-size="19" font-weight="700" fill="#0f172a">Design</text>
    <text x="361" y="314" font-size="12.5" fill="#475569"><tspan x="361" dy="0">Reads the ledger and designs a</tspan><tspan x="361" dy="18">surrogate adapted to THIS geometry</tspan><tspan x="361" dy="18">(capacity, features, weighting).</tspan></text>
    <rect x="361" y="372" width="214" height="30" rx="8" fill="#e0e7ff"/>
    <text x="468" y="391" text-anchor="middle" font-size="12.5" font-weight="600" fill="#4338ca">→ PLAN.md</text>
  </g>

  <!-- CARD 3 — ENGINEER -->
  <g>
    <rect x="646" y="210" width="250" height="212" rx="14" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
    <rect x="664" y="228" width="186" height="26" rx="13" fill="#d97706"/>
    <text x="757" y="246" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">3 · ENGINEER</text>
    <text x="664" y="288" font-size="19" font-weight="700" fill="#0f172a">Build &amp; train</text>
    <text x="664" y="314" font-size="12.5" fill="#475569"><tspan x="664" dy="0">Implements the plan from scratch,</tspan><tspan x="664" dy="18">trains, evaluates held-out-frequency</tspan><tspan x="664" dy="18">L2, saves model + prediction plots.</tspan></text>
    <rect x="664" y="372" width="214" height="30" rx="8" fill="#fef3c7"/>
    <text x="771" y="391" text-anchor="middle" font-size="12.5" font-weight="600" fill="#b45309">→ metrics.json + model</text>
  </g>

  <!-- CARD 4 — REPORTER -->
  <g>
    <rect x="949" y="210" width="250" height="212" rx="14" fill="#ffffff" stroke="#e5e7eb" filter="url(#shadow)"/>
    <rect x="967" y="228" width="180" height="26" rx="13" fill="#e11d48"/>
    <text x="1057" y="246" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff" letter-spacing="0.5">4 · REPORTER</text>
    <text x="967" y="288" font-size="19" font-weight="700" fill="#0f172a">Report</text>
    <text x="967" y="314" font-size="12.5" fill="#475569"><tspan x="967" dy="0">Aggregates the results and the</tspan><tspan x="967" dy="18">geometry-adaptive decisions into</tspan><tspan x="967" dy="18">one readable report.</tspan></text>
    <rect x="967" y="372" width="214" height="30" rx="8" fill="#ffe4e8"/>
    <text x="1074" y="391" text-anchor="middle" font-size="12.5" font-weight="600" fill="#be123c">→ REPORT.md</text>
  </g>

  <!-- handoff arrows between cards -->
  <g>
    <line x1="293" y1="316" x2="340" y2="316" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
    <line x1="596" y1="316" x2="643" y2="316" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
    <line x1="899" y1="316" x2="946" y2="316" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  </g>

  <!-- cards -> blackboard (faint) -->
  <g stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="2 4">
    <line x1="165"  y1="422" x2="165"  y2="444"/>
    <line x1="468"  y1="422" x2="468"  y2="444"/>
    <line x1="771"  y1="422" x2="771"  y2="444"/>
    <line x1="1074" y1="422" x2="1074" y2="444"/>
  </g>

  <!-- BLACKBOARD STRIP -->
  <rect x="40" y="444" width="1159" height="40" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-dasharray="5 4"/>
  <text x="620" y="469" text-anchor="middle" font-size="12.5" fill="#475569">
    <tspan font-weight="700" fill="#334155">Shared blackboard</tspan> — files in the run directory passed stage to stage: ledger.json · PLAN.md · metrics.json · REPORT.md · figures/ · logs/
  </text>

  <!-- GENERALIZATION BANNER -->
  <rect x="40" y="510" width="1159" height="56" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="70" y="544" font-size="26" fill="#4f46e5">⟳</text>
  <text x="620" y="538" text-anchor="middle" font-size="13.5" font-weight="700" fill="#3730a3">Geometry-agnostic by construction</text>
  <text x="620" y="556" text-anchor="middle" font-size="12.5" fill="#475569">Point the same four agents at a new target and they re-derive everything from the data — no geometry-specific code, no retuning by hand.</text>
</svg>
